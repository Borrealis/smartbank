[project]
name = "worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic",
    "python-dotenv",
    "openai",
    "faststream[cli,kafka]>=0.7.5",
    "langchain-core>=1.6.1",
    "langchain-text-splitters>=1.1.2",
    "langchain-google-genai>=4.4.0",
    "asyncpg>=0.31.0",
    "pydantic-settings",
    "sqlalchemy",
    "pgvector",
    "google-genai",
    "tenacity"
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]

[tool.pytest.ini_options]
pythonpath = ["."]
