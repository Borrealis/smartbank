[project]
name = "gateway"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "sqlalchemy>=2.0.52",
    "asyncpg>=0.31.0",
    "alembic>=1.19.1",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.15.0",
    "faststream[kafka]>=0.7.4",
    "pgvector>=0.5.0",
    "uvicorn>=0.52.4",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "greenlet>=3.5.5",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
