[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
[tool.ruff.format]
quote-style = "double"

[dependency-groups]
dev = [
    "ruff>=0.16.1",
]
[project]
name = "SMART_BANK"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31.0",
    "pydantic>=2.0.0",
    "fastapi>=0.141.1",
    "sqlalchemy>=2.0.52",
    "asyncpg>=0.31.0",
    "alembic>=1.19.1",
    "pydantic-settings>=2.15.0",
    "faststream[kafka]>=0.7.4",
    "pgvector>=0.5.0",
    "psycopg2-binary>=2.9.12",
    "uvicorn>=0.52.4",
    "httpx>=0.28.1",
]
